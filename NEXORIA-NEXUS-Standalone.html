async function change(e){const n=e.target;if(n.id==="workspace"){workspaceId=n.value;localStorage.setItem("nx-workspace",workspaceId);render()}if(n.id==="language-select"){await setLanguage(n.value);render()}if(n.id==="theme-select"){theme=n.value;localStorage.setItem("nx-theme",theme);render()}if(n.dataset.do==="status"){const p=(await all("projects")).find(x=>x.id===n.dataset.id);if(p){p.status=n.value;if(n.value==="completed")p.progress=100;await store.put("projects",p);render()}}if(n.dataset.do==="task"){const x=(await all("tasks")).find(y=>y.id===n.dataset.id);if(x){x.done=n.checked;await store.put("tasks",x);render()}}}
async function imported(e){const f=e.target.files?.[0];if(!f)return;try{const txt=await f.text();if(e.target.dataset.mode==="backup"){await store.restore(JSON.parse(txt));await workspaces();toast(t("backupRestored"))}else{await store.put("files",{id:id(),workspaceId,name:f.name,content:txt,size:f.size});toast(t("fileCreated"))}render()}catch(err){toast(err.message||t("invalidBackup"))}e.target.value="";delete e.target.dataset.mode}
async function boot(){workspaceId=localStorage.getItem("nx-workspace")||"";await setLanguage(lang);await workspaces();document.addEventListener("click",click);document.addEventListener("submit",submit);document.addEventListener("change",change);$("#importer").addEventListener("change",imported);$("#language").addEventListener("click",async()=>{await setLanguage(lang==="en"?"fa":"en");render()});$("#quick-backup").addEventListener("click",backup);$("#new-workspace").addEventListener("click",async()=>{const n=prompt(t("workspacePrompt"));if(!n?.trim())return;const x=await store.put("workspaces",{id:id(),name:n.trim().slice(0,40)});workspaceId=x.id;await workspaces();render();toast(t("workspaceCreated"))});$("#menu").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));document.addEventListener("input",e=>{if(e.target.id==="editor"){code=e.target.value;sessionStorage.setItem("nx-code",code)}});await render();}
boot().catch(e=>{console.error(e);$("#view").textContent="NEXORIA could not initialize. Reload the page."});

</script></body></html>
