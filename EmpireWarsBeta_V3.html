<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Empire Wars — قلمرو</title>
<style>
:root{--g:#f5c451;--m:#a9b8c9;--l:#ffffff22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd0e0;font-family:Tahoma,"Segoe UI",sans-serif;color:#f7f4e9}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hud{position:fixed;top:0;inset-inline:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;z-index:2;pointer-events:none}
.row{display:flex;gap:6px;justify-content:space-between}
.pill{background:#0f1c2cd9;border:1px solid var(--l);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.pill b{color:var(--g)}
.bt{margin-top:8px;background:#0f1c2cd9;border:1px solid var(--l);border-radius:14px;padding:8px 12px;display:none;font-size:12px}
.bt.on{display:block}
.hp{height:9px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(#7be38a,#35a653);transition:width .2s}
.bar{position:fixed;bottom:0;inset-inline:0;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3}
.nav{flex:1;max-width:80px;min-width:0;background:linear-gradient(#2c4159,#1b2b3d);border:1px solid var(--l);border-radius:16px;padding:9px 4px;font-size:11px;box-shadow:0 4px 0 #0c1522}
.nav span{display:block;font-size:20px;margin-bottom:2px}
.nav:active,.go:active{transform:translateY(3px);box-shadow:none}
.go{flex:1.5;max-width:190px;background:linear-gradient(#ffd877,#d49a2c);color:#2a1f0a;font-weight:900;font-size:14px;border-radius:18px;padding:14px 8px;box-shadow:0 5px 0 #8e6420}
.go small{display:block;font-weight:400;font-size:11px}
.go:disabled{filter:grayscale(.7);opacity:.6}
.back{position:fixed;inset:0;background:#030811a6;opacity:0;pointer-events:none;transition:.3s;z-index:8}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;width:min(720px,100%);max-height:74vh;display:flex;flex-direction:column;background:linear-gradient(#22344b,#16222f);border:1px solid #ffffff2a;border-bottom:0;border-radius:24px 24px 0 0;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:9;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px}
.sh h2{margin:0;font-size:16px;color:var(--g)}
.x{background:#36495f;width:30px;height:30px;border-radius:50%}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tab{flex:1 0 auto;white-space:nowrap;background:#1a2a3c;color:var(--m);padding:9px 4px;border-radius:999px;font-size:12px;border:1px solid var(--l)}
.tab.on{background:linear-gradient(#ffd877,#d49a2c);color:#2a1f0a;font-weight:800}
.body{overflow:auto;padding:0 14px 16px;touch-action:pan-y;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{display:flex;align-items:center;gap:10px;background:linear-gradient(145deg,#2a3f57,#1c2b3c);border:1px solid var(--l);border-radius:14px;padding:9px;min-width:0}
.ico{flex:none;width:50px;height:50px;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle,#4a6580,#2c4158);border-radius:12px}
.inf{flex:1;min-width:0}
.inf h3{margin:0;font-size:13px}
.inf p{margin:3px 0 6px;font-size:10px;color:var(--m)}
.buy{background:#3b5870;padding:6px 8px;border-radius:999px;font-weight:700;font-size:11px;width:100%}
.buy b{color:var(--g)}.buy:disabled{opacity:.4}.buy.ok{background:#2f6b4a}
.note{grid-column:1/-1;font-size:11px;color:var(--m);margin:0}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:#e9f1df;color:#1e3428;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1}
.fl{position:fixed;z-index:4;font-weight:900;color:var(--g);text-shadow:0 2px 3px #000a;pointer-events:none;animation:up 1s forwards;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
.modal{position:fixed;inset:0;background:#050b13cc;display:none;place-items:center;padding:18px;z-index:15}
.modal.on{display:grid}
.mb{max-width:380px;width:100%;background:#1d2b3e;border:1px solid #ffffff2a;border-radius:20px;padding:22px;text-align:center}
.mb h2{margin:0 0 8px;color:var(--g)}.mb p{color:var(--m);font-size:13px;line-height:1.9;margin:0 0 12px}
.mb button{background:#35495d;padding:9px 22px;border-radius:999px}
.pb{height:6px;border-radius:6px;background:#ffffff26;overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;background:linear-gradient(#ffd877,#d49a2c)}
.q{grid-column:1/-1;background:#16222f;border:1px solid var(--l);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--m)}
.hud2{margin-top:6px;display:flex;gap:6px;pointer-events:none}.hud2 .pill{font-size:12px;padding:4px 10px}
@media(max-width:430px){.body{grid-template-columns:1fr}}
</style></head>
<body>
<div class="hud"><div class="row"><div class="pill">🪙 <b id="coins"></b> <small id="inc"></small></div><div class="pill">🛡 <b id="pow"></b></div><div class="pill">🏰 مرحله <b id="stg"></b></div></div><div class="hud2"><div class="pill">👥 <b id="pop"></b></div><div class="pill">🍖 <b id="fd"></b></div><div class="pill" id="wx"></div></div>
<div class="bt" id="bt"><div class="row"><span>👑 قلعه</span><span>دشمن باقی‌مانده: <b id="left"></b></span></div><div class="hp"><i id="hpb"></i></div></div></div>
<nav class="bar">
<button class="nav" onclick="openSheet('army')"><span>⚔️</span>نیروها</button>
<button class="go" id="go" onclick="startBattle(S.stage)">شروع نبرد<small id="goS"></small></button>

<button class="nav" onclick="openSheet('b')"><span>🏗</span>ساختمان‌ها</button>

</nav>
<div class="back" id="back" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet"><div class="sh"><h2 id="sht"></h2><button class="x" onclick="closeSheet()">✕</button></div>
<div class="tabs"><button class="tab" data-t="army">نیروها</button><button class="tab" data-t="staff">کارمندان</button><button class="tab" data-t="b">ساختمان‌ها</button><button class="tab" data-t="p">مردم</button><button class="tab" data-t="t">تجارت</button><button class="tab" data-t="map">مرحله‌ها</button></div>
<div class="body" id="body"></div></aside>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mb"><h2 id="mt"></h2><p id="mp"></p><button onclick="$('modal').classList.remove('on')">ادامه</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const fa=n=>Math.floor(n).toLocaleString('fa-IR'),$=id=>document.getElementById(id);
const U={sword:{n:'شمشیرزن',i:'⚔️',c:100,hp:100,dmg:14,rng:1.8,spd:3.4,col:0x7a4a2a,s:1},

const W={builder:{n:'سازنده',i:'👷',c:300,d:'ساختمان‌ها را می‌سازد (زمان هر ساختمان فرق دارد)'},
farmer:{n:'مزرعه‌دار',i:'👨‍🌾',c:250,d:'+۲ سکه در ثانیه (روی مزرعه)'},
miner:{n:'معدنچی',i:'⛏️',c:750,d:'+۷ سکه در ثانیه (روی معدن)'}};
const SN=['اردوی راهزن‌ها','نگهبانان مرزی','دره‌ی گرگ‌ها','قلعه‌ی سنگی','سپاه شمال','جنگل تاریک','گردان آهنین','فرمانروای تاریکی','کوه‌های یخی','دژ طوفان','صحرای سوزان','نبرد رودخانه','سپاه سایه','قلعه‌ی آتش','دره‌ی اژدها','گردان مرگ','شاه جنگجو','ارباب ظلمت','امپراتور کهن','نبرد نهایی'];
let S={coins:6000,army:{sword:0,archer:0,spear:0,knight:0},unlocked:1,stage:1,work:{},bought:{farm:1,agri:1},blds:[{t:'farm',slot:0},{t:'agri',slot:0}],queue:[],nid:0};
try{const d=JSON.parse(localStorage.getItem('ew3'));if(d)S=Object.assign(S,d)}catch(e){}
S.ppl=Array.isArray(S.ppl)?S.ppl.filter(p=>p&&typeof p==='object'):[];S.coins=Number.isFinite(+S.coins)?Math.max(0,+S.coins):6000;S.food=Number.isFinite(+S.food)?Math.max(0,+S.food):40;S.tx=0;S.pid=Number(S.pid)||0;S.work={builder:1,farmer:0,miner:0};S.apps=Array.isArray(S.apps)?S.apps:[];S.staff=S.staff||{};S.army=S.army||{};['sword','archer','spear','knight','lancer','axe'].forEach(k=>S.army[k]=Math.max(0,Number(S.army[k])||0));S.blds=Array.isArray(S.blds)?S.blds.filter(b=>b&&typeof b.t==='string'&&['farm','mine','market','bank','buildsch','house','city','barracks','guard','fish','agri','minesch','trade','caravan','mill','carp','post'].includes(b.t)).map(b=>({t:b.t,slot:Number(b.slot)||0})):[];S.queue=Array.isArray(S.queue)?S.queue:[];S.bought=S.bought||{};S.stage=Math.max(1,Math.min(20,Number(S.stage)||1));S.unlocked=Math.max(1,Math.min(20,Number(S.unlocked)||1));S.nid=Number(S.nid)||0;S.queue=S.queue.filter(j=>j&&B[j.t]&&Number.isFinite(+j.left));S.queue.forEach(j=>{j.total=Number(j.total)||B[j.t].t;j.slot=Number(j.slot)||0;j.id=Number(j.id)||++S.nid;});S.ppl.forEach(p=>{if(!p||typeof p!=='object')return;if(p.job==='a')p.job='farmer';else if(p.job==='m')p.job='miner';else if(p.job==='f')p.job=null;p.id=Number(p.id)||++S.pid;p.n=String(p.n||'شهروند');p.hx=Number.isFinite(+p.hx)?+p.hx:(-8+Math.random()*16);p.hz=Number.isFinite(+p.hz)?+p.hz:11+Math.random()*4;p.skills=p.skills&&typeof p.skills==='object'?p.skills:{};p.ex=Number(p.ex)||0;p.tr=p.tr&&['a','m','f','c','b','w','j'].includes(p.tr.k)?{k:p.tr.k,left:Math.max(1,Number(p.tr.left)||120)}:null;});
const save=()=>{try{localStorage.setItem('ew3',JSON.stringify(S))}catch(e){}};
const total=()=>Object.values(S.army).reduce((a,b)=>a+b,0),cap=()=>8+nb('barracks')*12;
const nb=t=>S.blds.filter(b=>b.t==t).length,price=t=>Math.ceil(B[t].c*Math.pow(GR,S.bought[t]||0)),
popN=()=>S.work.builder+S.work.farmer+S.work.miner,popCap=()=>5+nb('house')*4+nb('city')*15,busy=()=>Math.min(S.work.builder,S.queue.length),
workF=()=>Math.min(S.work.farmer+hr('a'),nb('farm')*SLOTS),workM=()=>Math.min(S.work.miner+hr('m'),nb('mine')*SLOTS);
const income=()=>0;
const power=()=>Object.keys(S.army).reduce((s,k)=>s+S.army[k]*(U[k].hp/10+U[k].dmg*1.5),0);

/* ---------- 3D ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.prepend(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9fd0e0);sc.fog=new THREE.Fog(0x9fd0e0,50,110);
const cam=new THREE.PerspectiveCamera(42,1,.1,250);let yaw=.55,pitch=.6,dist=40,tx=0,tz=0;
const setCam=()=>{cam.position.set(tx+Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,tz+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(tx,3,tz)};
sc.add(new THREE.HemisphereLight(0xdff3ff,0x5a7a45,.85));
const sun=new THREE.DirectionalLight(0xfff0cf,.9);sun.position.set(22,34,16);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,far:100});sc.add(sun);
const mk=(g,c,x,y,z,p)=>{const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m};
const bx=(w,h,d,c,x,y,z,p)=>mk(new THREE.BoxGeometry(w,h,d),c,x,y+h/2,z,p);
const cy=(r,h,c,x,y,z,p,s=14)=>mk(new THREE.CylinderGeometry(r,r*1.06,h,s),c,x,y+h/2,z,p);
const co=(r,h,c,x,y,z,p,s=14)=>mk(new THREE.ConeGeometry(r,h,s),c,x,y+h/2,z,p);

mk(new THREE.CylinderGeometry(130,130,2,48),0x74a85c,0,-1,0).castShadow=false;
bx(3.2,.08,16,0xcdb88a,0,0,14);
/* castle */
const castle=new THREE.Group();sc.add(castle);
function wall(x,z,w,d){bx(w,4,d,ST,x,0,z,castle);const a=w>d;const n=Math.floor((a?w:d)/1.1);for(let i=0;i<n;i++){const o=-(a?w:d)/2+.55+i*1.1;bx(a?.6:d,.7,a?d:.6,ST2,a?x+o:x,4,a?z:z+o,castle)}}
wall(0,-6.5,13.4,1.4);wall(6.5,0,1.4,13.4);wall(-6.5,0,1.4,13.4);wall(-4.1,6.5,5,1.4);wall(4.1,6.5,5,1.4);
bx(3.6,1,1.6,ST,0,3.2,6.5,castle);bx(3,3.2,.5,0x3a2c20,0,0,6.6,castle);
for(let i=-1;i<2;i++)bx(.12,3,.1,0x6f5d43,i*.8,0,6.9,castle);
[[-6.5,-6.5],[6.5,-6.5],[-6.5,6.5],[6.5,6.5]].forEach(([x,z],i)=>{cy(1.9,7,ST,x,0,z,castle);cy(2.2,.7,ST2,x,7,z,castle);co(2.4,3.4,RF,x,7.7,z,castle);if(i%2==0){bx(.1,2,.1,0x5b5140,x,11,z,castle);}});
bx(7,9,7,ST,0,0,-.5,castle);for(let i=0;i<6;i++){bx(.8,.8,.8,ST2,-3+i*1.2,9,-4,castle);bx(.8,.8,.8,ST2,-3+i*1.2,9,3,castle)}
cy(1.9,5,ST,0,9,-.5,castle);cy(2.3,.7,ST2,0,14,-.5,castle);co(2.6,4,RF,0,14.7,-.5,castle);
bx(.12,3.2,.12,0x5b5140,0,18.6,-.5,castle);const flag=bx(2.2,1.2,.1,0xd94d3f,1.2,20.2,-.5,castle);
const wm=new THREE.MeshStandardMaterial({color:0xffd36b,emissive:0xffb000,emissiveIntensity:.8});
[[-2,3],[0,3],[2,3]].forEach(([x,y])=>{const w=new THREE.Mesh(new THREE.BoxGeometry(.7,1.4,.2),wm);w.position.set(x,y+3,3.05);castle.add(w)});
/* gfx */
(function(){
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;R.shadowMap.type=THREE.PCFSoftShadowMap;sun.shadow.bias=-.0006;
const hz=0xf0dcb0;sc.background.set(hz);sc.fog.color.set(hz);sc.fog.near=45;sc.fog.far=125;
const rnd=(a,b)=>a+Math.random()*(b-a),P=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r];
sc.add(new THREE.Mesh(new THREE.SphereGeometry(180,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,fog:false,depthWrite:false,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;void main(){float h=clamp(normalize(p).y,0.,1.);gl_FragColor=vec4(mix(vec3(.94,.86,.69),vec3(.3,.58,.86),pow(h,.5)),1.);}'})));
const disc=(r,c,x,z,y)=>{const m=mk(new THREE.CircleGeometry(r,20),c,x,y,z);m.rotation.x=-Math.PI/2;m.castShadow=false;return m};
for(let i=0;i<45;i++){const[x,z]=P(rnd(6,75),rnd(0,6.28));disc(rnd(3,9),[0x6c9f52,0x86b96a,0x5f9150,0x93c274][i%4],x,z,.01+i*.002)}
disc(5.9,0xb9ad94,0,0,.06);
